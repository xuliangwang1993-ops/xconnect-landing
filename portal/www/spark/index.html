<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>X-Connect · 选择入口</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --chat:#8fc4ff;         /* 蓝水晶 */
    --factory:#f0b9a8;      /* 玫瑰金 */
    --fg:#f2f4f7;
    --dim:#7e838f;
  }
  html,body{height:100%}
  body{
    background:#000;
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    overflow:hidden;position:relative;
  }

  /* ---------- 背景辉光 ---------- */
  body::before{
    content:'';position:fixed;inset:-20%;pointer-events:none;
    background:
      radial-gradient(46% 40% at 50% 50%,rgba(120,180,255,.10),transparent 72%),
      radial-gradient(40% 36% at 18% 82%,rgba(255,170,150,.07),transparent 72%),
      radial-gradient(40% 36% at 84% 18%,rgba(150,200,255,.06),transparent 72%);
    animation:bgIn 1.6s ease-out both;
  }
  @keyframes bgIn{from{opacity:0}to{opacity:1}}

  /* ---------- 闪光 ---------- */
  .flash{
    position:fixed;left:50%;top:50%;width:min(64vmin,520px);aspect-ratio:1;
    margin:-0.5px 0 0 -0.5px;transform:translate(-50%,-50%);
    border-radius:50%;pointer-events:none;z-index:3;
    background:radial-gradient(circle,#fff 0%,rgba(200,225,255,.85) 18%,rgba(140,190,255,.25) 42%,transparent 68%);
    animation:flash 1.15s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes flash{
    0%  {opacity:0;transform:translate(-50%,-50%) scale(.14)}
    7%  {opacity:1;transform:translate(-50%,-50%) scale(.5)}
    22% {opacity:.55;transform:translate(-50%,-50%) scale(1.5)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(3.6)}
  }
  .shock{
    position:fixed;left:50%;top:50%;width:min(30vmin,240px);aspect-ratio:1;
    transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:2;
    border:1px solid rgba(210,232,255,.55);
    animation:shock 1.5s cubic-bezier(.16,.8,.3,1) .12s both;
  }
  @keyframes shock{
    0%  {opacity:0;transform:translate(-50%,-50%) scale(.3)}
    18% {opacity:.8}
    100%{opacity:0;transform:translate(-50%,-50%) scale(4.2)}
  }

  /* ---------- 水晶 X ---------- */
  .jewel{position:relative;display:block;flex:none}
  .jewel::before{
    content:'';position:absolute;inset:12.5%;
    background-image:url('../assets/x-materials-review.png');
    background-size:300% 100%;background-repeat:no-repeat;
  }
  .jewel.silver::before{
    background-position:0% 50%;
    filter:brightness(1.55) contrast(1.05) saturate(.6) drop-shadow(0 0 9px rgba(225,245,255,.6));
  }
  .jewel.blue::before{
    background-position:50% 50%;
    filter:brightness(1.5) saturate(1.35) drop-shadow(0 0 14px rgba(90,170,255,.65));
  }
  .jewel.rose::before{
    background-position:100% 50%;
    filter:brightness(1.45) saturate(1.15) hue-rotate(-6deg) drop-shadow(0 0 14px rgba(255,190,170,.6));
  }

  /* 中央银X：闪一下就散开，把位置让给左右两扇门 */
  .core{
    position:fixed;left:50%;top:50%;width:132px;height:166px;
    transform:translate(-50%,-50%);z-index:4;pointer-events:none;
    animation:coreLife 1.5s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes coreLife{
    0%  {opacity:0;transform:translate(-50%,-50%) scale(.3)}
    16% {opacity:1;transform:translate(-50%,-50%) scale(1.1)}
    40% {opacity:1;transform:translate(-50%,-50%) scale(1)}
    72% {opacity:.9;transform:translate(-50%,-50%) scale(1.06)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.45)}
  }

  /* ---------- 两扇门 ---------- */
  .stage{
    position:relative;z-index:5;
    display:flex;align-items:center;justify-content:center;
    gap:clamp(22px,7vw,104px);
    width:100%;max-width:920px;padding:0 20px;
  }
  /* 中间一条极细的竖线，把左/右两条路分开 */
  .stage::before{
    content:'';position:absolute;left:50%;top:50%;width:1px;
    height:clamp(150px,26vh,250px);transform:translate(-50%,-50%);
    background:linear-gradient(180deg,transparent,rgba(150,170,200,.20) 22%,rgba(150,170,200,.20) 78%,transparent);
    opacity:0;animation:fadeIn .9s ease-out 1.5s both;
  }

  .door{
    --from:0px;
    position:relative;
    display:flex;flex-direction:column;align-items:center;gap:11px;
    text-decoration:none;color:inherit;background:none;border:0;
    padding:14px 8px;border-radius:20px;cursor:pointer;
    opacity:0;
    animation:doorIn .82s cubic-bezier(.16,.9,.28,1) 1.02s both;
    transition:transform .3s cubic-bezier(.22,.61,.36,1);
  }
  .door.chat{--from:88px}
  .door.factory{--from:-88px}
  @keyframes doorIn{
    0%  {opacity:0;transform:translateX(var(--from)) scale(.44)}
    100%{opacity:1;transform:translateX(0) scale(1)}
  }

  /* 箭头挂在门的外侧：蓝X往左伸，玫瑰金X往右伸 */
  .door .arrow{
    position:absolute;top:52%;display:flex;align-items:center;
    font-size:0;color:#3d434e;pointer-events:none;
    transition:color .25s,opacity .25s;opacity:.85;
  }
  .door.chat .arrow{right:calc(100% + 6px);transform:translateY(-50%)}
  .door.factory .arrow{left:calc(100% + 6px);transform:translateY(-50%)}
  .door .arrow i{
    display:block;width:clamp(30px,4.4vw,54px);height:1px;
    background:currentColor;position:relative;
  }
  .door .arrow i::after{
    content:'';position:absolute;top:50%;width:5px;height:5px;
    border-top:1px solid currentColor;border-left:1px solid currentColor;
  }
  .door.chat .arrow i::after{left:0;transform:translateY(-50%) rotate(-45deg)}
  .door.factory .arrow i::after{right:0;transform:translateY(-50%) rotate(135deg)}

  .door .label{
    font-size:clamp(25px,3.4vw,38px);font-weight:400;
    letter-spacing:-.045em;line-height:1;white-space:nowrap;
  }
  .door.chat .label{color:var(--chat)}
  .door.factory .label{color:var(--factory)}
  .door .jewel{width:clamp(72px,10vw,112px);height:clamp(90px,12.6vw,140px);transition:transform .3s}
  .door .hint{font-size:12.5px;color:var(--dim);letter-spacing:.02em;text-align:center;line-height:1.5;min-height:19px}
  .door:hover{transform:translateY(-6px)}
  .door.chat:hover .arrow{color:var(--chat)}
  .door.factory:hover .arrow{color:var(--factory)}
  .door:active{transform:translateY(-2px) scale(.985)}
  .door:focus-visible{outline:2px solid rgba(180,229,255,.85);outline-offset:6px}

  /* ---------- 顶部：首页那颗 X ---------- */
  .brand{
    position:fixed;top:clamp(22px,4.4vh,44px);left:50%;
    transform:translateX(-50%);
    display:flex;align-items:center;
    font-size:clamp(22px,2.3vw,31px);font-weight:300;
    letter-spacing:-.065em;color:#f0f1f2;white-space:nowrap;
    opacity:0;animation:fadeUp .8s ease-out 1.0s both;z-index:6;
    pointer-events:none;
  }
  .brand .jewel{width:clamp(38px,4.1vw,54px);height:clamp(47px,5.1vw,67px);margin-right:0}

  .who{
    position:fixed;top:clamp(76px,12.5vh,116px);left:50%;transform:translateX(-50%);
    font-size:12px;letter-spacing:.16em;color:#575d69;text-align:center;
    opacity:0;animation:fadeUp .7s ease-out 1.35s both;z-index:6;white-space:nowrap;
  }
  .who b{color:#a8b0bd;font-weight:500;letter-spacing:.1em}
  @keyframes fadeUp{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

  .again{
    position:fixed;bottom:clamp(26px,5vh,52px);left:50%;transform:translateX(-50%);
    font-size:12px;color:#4c525d;letter-spacing:.04em;text-decoration:none;
    padding:8px 14px;border-radius:999px;border:1px solid transparent;
    transition:.25s;opacity:0;animation:fadeIn .6s ease-out 1.5s both;z-index:6;
  }
  .again:hover{color:#98a0ad;border-color:#24272e}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* ---------- 跳过动画 ---------- */
  body.done .flash,body.done .shock,body.done .core{display:none}
  body.done .door{animation:none;opacity:1;transform:none}
  body.done .brand{animation:none;opacity:1}
  body.done .who{animation:none;opacity:1}
  body.done .again{animation:none;opacity:1}

  @media (max-width:520px){
    .stage{gap:16px;padding:0 12px}
    .door{gap:9px;padding:12px 4px}
    .door .jewel{width:80px;height:100px}
    .door .label{font-size:23px}
    .door .hint{font-size:11px}
    .door .arrow i{width:22px}
    .core{width:96px;height:120px}
    .brand{font-size:20px;top:20px}
    .brand .jewel{width:34px;height:42px}
    .who{top:88px}
  }
  @media (max-width:380px){
    .door .arrow{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before{animation:none!important}
    .flash,.shock,.core{display:none}
    .door,.who,.again{opacity:1!important;transform:none!important}
  }
</style>
</head>
<body>

  <div class="brand"><span class="jewel silver" aria-hidden="true"></span><span>-connect</span></div>
  <div class="who" id="who"></div>

<div class="flash" aria-hidden="true"></div>
<div class="shock" aria-hidden="true"></div>
<div class="core jewel silver" aria-hidden="true"></div>

<main class="stage">
  <a class="door chat" id="door-chat" href="https://app.x-connect.ai/">
    <span class="label">Chat</span>
    <span class="jewel blue" aria-hidden="true"></span>
    <span class="hint">跟他聊，边说边改</span>
    <span class="arrow" aria-hidden="true"><i></i></span>
  </a>

  <a class="door factory" id="door-factory" href="https://factory.x-connect.ai/">
    <span class="label">Factory</span>
    <span class="jewel rose" aria-hidden="true"></span>
    <span class="hint">把活儿交出去，等着收货</span>
    <span class="arrow" aria-hidden="true"><i></i></span>
  </a>
</main>

<a class="again" id="again" href="https://workbench.x-connect.ai/">换一个小助手</a>

<script>
(function(){
  'use strict';

  /* 角色名以 workbench 的 lounge.js FALLBACK 为准，id 一一对应 */
  var NAMES = {
    voice: '李黑鸭', scribe: '斯巴达', brain: '四毛', deep: '武天', admin: '狒狒'
  };

  var $ = function(s){ return document.querySelector(s); };

  function safeId(raw){
    if (!raw) return '';
    var v = String(raw).trim().toLowerCase();
    return /^[a-z][a-z0-9_-]{0,23}$/.test(v) ? v : '';
  }

  function cookie(name){
    var m = document.cookie.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]*)'));
    if (!m) return '';
    try { return decodeURIComponent(m[1]); } catch(e){ return ''; }
  }

  /* 只接受自家域，防止开放跳转 */
  function safeReturn(raw){
    if (!raw) return '';
    try {
      var u = new URL(raw, location.origin);
      if (u.protocol === 'http:' || u.protocol === 'https:'){
        if (u.hostname === 'x-connect.ai' || /\.x-connect\.ai$/.test(u.hostname)) return u.href;
      }
    } catch(e){}
    return '';
  }

  var q = new URLSearchParams(location.search);
  var id = safeId(q.get('assistant')) || safeId(cookie('xc_assistant')) || '';

  /* 记到域级 cookie，app / factory 两个子域都读得到 */
  if (id){
    try {
      document.cookie = 'xc_assistant=' + encodeURIComponent(id) +
        '; Path=/; Domain=.x-connect.ai; Max-Age=' + (60*60*24*365) + '; SameSite=Lax; Secure';
    } catch(e){}
    try { localStorage.setItem('xcw_assistant', id); } catch(e){}
  }

  /* 落点：Chat 进 App，带上 ?assistant=；Factory 不认 query，
     靠上面写好的 xc_assistant 域 cookie 认人。 */
  var back = safeReturn(q.get('next'));
  var chatHref, factHref;
  var idQs = id ? 'assistant=' + encodeURIComponent(id) : '';

  if (back && /(^|\.)app\.x-connect\.ai$/.test(new URL(back).hostname)){
    chatHref = back;
  } else {
    chatHref = 'https://app.x-connect.ai/' + (idQs ? '?' + idQs : '');
  }
  factHref = 'https://factory.x-connect.ai/';

  var aChat = $('#door-chat'), aFact = $('#door-factory');
  aChat.href = chatHref;
  aFact.href = factHref;

  /* 顶部：谁已经就位 */
  if (id){
    $('#who').innerHTML = '<b>' + (NAMES[id] || id) + '</b> 已经就位';
  } else {
    $('#who').innerHTML = '去哪边开始';
  }

  /* 点任意空白处跳过闪光，直接进可选状态 */
  function skip(){
    document.body.classList.add('done');
    document.removeEventListener('pointerdown', skip);
    clearTimeout(t);
  }
  var t = setTimeout(skip, 2100);
  document.addEventListener('pointerdown', function(e){
    if (e.target.closest && e.target.closest('.door')) return;
    skip();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') skip();
    /* 左右方向键直达 */
    if (e.key === 'ArrowLeft') { e.preventDefault(); location.href = chatHref; }
    if (e.key === 'ArrowRight') { e.preventDefault(); location.href = factHref; }
  });
})();
</script>
</body>
</html>
