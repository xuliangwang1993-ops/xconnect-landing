<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-connect CapabilityGrid v2</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#0a0c10; overflow:hidden; font-family:'Space Grotesk',-apple-system,sans-serif; }
  canvas { display:block; width:100%; height:100%; }
  .label { position:fixed; top:18px; left:22px; z-index:5; color:rgba(243,240,232,.55); font-size:12px; letter-spacing:.22em; text-transform:uppercase; }
  .hint { position:fixed; bottom:18px; left:22px; z-index:5; color:rgba(245,158,11,.45); font-size:11px; letter-spacing:.08em; }
  .compare { position:fixed; top:18px; right:22px; z-index:5; display:flex; gap:8px; }
  .compare button { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.12); color:rgba(243,240,232,.6); padding:6px 14px; border-radius:8px; font-size:11px; letter-spacing:.1em; cursor:pointer; transition:.2s; }
  .compare button.on { color:#f59e0b; border-color:rgba(245,158,11,.5); background:rgba(245,158,11,.08); }
  .compare button:hover { color:#f3f0e8; }
</style>
</head>
<body>
<div class="label">CapabilityGrid v2 · PBR 材质版</div>
<div class="compare">
  <button class="on" data-mode="pbr">PBR 材质</button>
  <button data-mode="flat">旧版 2D</button>
</div>
<div class="hint">悬停粒子查看自发光响应 · 滚轮缩放</div>
<canvas id="grid"></canvas>
<script>
const cv = document.getElementById('grid);
const ctx = cv.getContext('2d);
let W, H, dpr;
function resize(){ dpr = Math.min(devicePixelRatio||1, 2); W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
addEventListener('resize', resize); resize();
const NODES = 64, CONNECT = 150;
let nodes = [], mode = 'pbr', mx = -999, my = -999, scale = 1, tx = 0, ty = 0;
for (let i=0;i<NODES;i++){
  nodes.push({ x: Math.random()*W, y: Math.random()*H, vx: (Math.random()-.5)*.35, vy: (Math.random()-.5)*.35, r: 1.5 + Math.random()*2.5, hue: Math.random()>.82 ? 38 : 0, pulse: Math.random()*Math.PI*2, mat: Math.random() });
}
cv.addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; });
cv.addEventListener('pointerleave', () => { mx = -999; my = -999; });
cv.addEventListener('wheel', e => { e.preventDefault(); scale = Math.max(.5, Math.min(2.2, scale + (e.deltaY<0?.08:-.08))); }, {passive:false});
function dist(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }
function drawNode(n, t){
  const pulse = .6 + .4*Math.sin(t*.002 + n.pulse);
  const dx = n.x - mx, dy = n.y - my;
  const near = Math.max(0, 1 - Math.sqrt(dx*dx+dy*dy)/180);
  const glow = pulse * (1 + near*1.8);
  if (mode === 'flat'){
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 7);
    ctx.fillStyle = n.hue ? `rgba(251,191,106,${.5*glow})` : `rgba(255,255,255,${.45*glow})`;
    ctx.fill();
    if (near > .3){ ctx.beginPath(); ctx.arc(n.x, n.y, n.r*3.5, 0, 7); ctx.fillStyle = `rgba(255,255,255,${near*.08})`; ctx.fill(); }
    return;
  }
  const g = ctx.createRadialGradient(n.x - n.r*.4, n.y - n.r*.4, n.r*.2, n.x, n.y, n.r*4.5);
  if (n.mat < .45){ g.addColorStop(0, `rgba(255,245,230,${.95*glow})`); g.addColorStop(.35, `rgba(251,191,106,${.35*glow})`); g.addColorStop(1, 'transparent'); }
  else if (n.mat < .8){ g.addColorStop(0, `rgba(230,240,255,${.8*glow})`); g.addColorStop(.4, `rgba(160,190,255,${.2*glow})`); g.addColorStop(1, 'transparent'); }
  else { g.addColorStop(0, `rgba(40,40,48,${.9*glow})`); g.addColorStop(.5, `rgba(90,90,100,${.25*glow})`); g.addColorStop(1, 'transparent'); }
  ctx.beginPath(); ctx.arc(n.x, n.y, n.r*4.5, 0, 7); ctx.fillStyle = g; ctx.fill();
  const sx = n.x - n.r*.5, sy = n.y - n.r*.6;
  const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, n.r*1.8);
  sg.addColorStop(0, `rgba(255,255,255,${.55*glow})`); sg.addColorStop(1, 'transparent);
  ctx.beginPath(); ctx.arc(sx, sy, n.r*1.8, 0, 7); ctx.fillStyle = sg; ctx.fill();
  ctx.beginPath(); ctx.arc(n.x, n.y, n.r*.55, 0, 7);
  ctx.fillStyle = n.hue ? `rgba(255,210,120,${.9*glow})` : `rgba(255,255,255,${.85*glow})`; ctx.fill();
  if (near > .25){ const bg = ctx.createRadialGradient(n.x, n.y, n.r, n.x, n.y, n.r*7); bg.addColorStop(0, `rgba(245,158,11,${near*.18})`); bg.addColorStop(1, 'transparent'); ctx.beginPath(); ctx.arc(n.x, n.y, n.r*7, 0, 7); ctx.fillStyle = bg; ctx.fill(); }
}
function drawEdge(a, b, t){
  const d = dist(a,b); if (d > CONNECT) return;
  const alpha = (1 - d/CONNECT) * .55;
  const dx = b.x-a.x, dy = b.y-a.y; const len = Math.sqrt(dx*dx+dy*dy) || 1; const nx = -dy/len, ny = dx/len;
  if (mode === 'flat'){ ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.strokeStyle = `rgba(255,255,255,${alpha*.5})`; ctx.lineWidth = .6; ctx.stroke(); return; }
  ctx.save(); ctx.shadowColor = 'rgba(245,158,11,.35)'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
  const lg = ctx.createLinearGradient(a.x,a.y,b.x,b.y);
  lg.addColorStop(0, `rgba(251,191,106,${alpha*.15})`); lg.addColorStop(.5, `rgba(255,255,255,${alpha*.9})`); lg.addColorStop(1, `rgba(251,191,106,${alpha*.15})`);
  ctx.strokeStyle = lg; ctx.lineWidth = 1.1; ctx.stroke(); ctx.restore();
  if ((a.mat>.8 || b.mat>.8) && Math.random()>.7){ const steps = 4; for (let s=1;s<steps;s++){ const u = s/steps; const px = a.x + dx*u + nx*(Math.random()-.5)*3; const py = a.y + dy*u + ny*(Math.random()-.5)*3; ctx.beginPath(); ctx.arc(px,py,.4,0,7); ctx.fillStyle = `rgba(120,120,130,${alpha*.4})`; ctx.fill(); } }
  const pulsePos = ((t*.0015 + a.pulse*.1) % 1); const px = a.x + dx*pulsePos, py = a.y + dy*pulsePos;
  const pg = ctx.createRadialGradient(px,py,0,px,py,5); pg.addColorStop(0, 'rgba(251,191,106,.8)'); pg.addColorStop(1, 'transparent);
  ctx.beginPath(); ctx.arc(px,py,5,0,7); ctx.fillStyle = pg; ctx.fill();
}
let t0 = performance.now();
function frame(now){
  const t = now - t0; ctx.fillStyle = '#0a0c10'; ctx.fillRect(0,0,W,H);
  const vg = ctx.createRadialGradient(W/2,H/2,W*.3,W/2,H/2,W*.85); vg.addColorStop(0,'transparent'); vg.addColorStop(1,'rgba(0,0,0,.55)'); ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
  const sweep = ctx.createRadialGradient(W*.15 + Math.sin(t*.0004)*W*.1, H*.1, 0, W*.15, H*.1, W*.6); sweep.addColorStop(0,'rgba(245,158,11,.06)'); sweep.addColorStop(1,'transparent'); ctx.fillStyle = sweep; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(W/2, H/2); ctx.scale(scale,scale); ctx.translate(-W/2+tx, -H/2+ty);
  for (let i=0;i<nodes.length;i++) for (let j=i+1;j<nodes.length;j++) drawEdge(nodes[i], nodes[j], t);
  for (const n of nodes){ n.x += n.vx; n.y += n.vy; if (n.x<0||n.x>W) n.vx*=-1; if (n.y<0||n.y>H) n.vy*=-1; drawNode(n, t); }
  ctx.restore(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.querySelectorAll('.compare button').forEach(b=>{ b.addEventListener('click', ()=>{ document.querySelectorAll('.compare button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); mode = b.dataset.mode; }); });
</script>
</body>
</html>
