<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>X-connect 工厂 · AoI 能力看板</title>
<style>
body{margin:0;font:14px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif;background:#0b0d10;color:#e8eaed}
header{display:flex;gap:16px;align-items:center;padding:14px 20px;border-bottom:1px solid #222}
header a{color:#9fe870;text-decoration:none}main{padding:20px;display:grid;gap:16px}
.goal{border:1px solid #2a2f36;border-radius:12px;padding:12px 16px}.goal h3{margin:0 0 8px}
.fn{display:flex;justify-content:space-between;padding:6px 0;border-top:1px dashed #222}
.st{font-size:12px;padding:1px 8px;border-radius:99px;background:#222}.st.unverified{background:#3a3a12;color:#ffe680}
.muted{color:#8a9099}pre{white-space:pre-wrap;background:#111;padding:12px;border-radius:8px;max-height:300px;overflow:auto}
.banner{padding:10px 20px;font-weight:600}.banner.live{background:#12331a;color:#9fe870}.banner.fixture{background:#4a2a00;color:#ffcf70}
.fn{cursor:pointer}.fn:hover,.fn.sel{background:#161b22}.st.verified{background:#12331a;color:#9fe870}
#tabs button{background:#161b22;color:#e8eaed;border:1px solid #2a2f36;border-radius:8px;padding:6px 14px;cursor:pointer}#tabs button.on{border-color:#9fe870;color:#9fe870}
#ev{position:fixed;right:0;top:0;bottom:0;width:min(420px,90vw);background:#111418;border-left:1px solid #333;padding:16px;overflow:auto;display:none}#ev.open{display:block}
</style>
</head>
<body>
<header><strong>AoI 能力看板</strong><a href="/">← 搭台首页</a><a href="/workbench">工作台 →</a>
<span class="muted" id="meta"></span></header>
<div id="banner" class="banner fixture">加载中…</div>
<nav id="tabs" style="display:flex;gap:8px;padding:10px 20px 0"><button data-t="struct">结构</button><button data-t="live">实时快照</button></nav>
<aside id="ev"></aside>
<main id="out"><p class="muted">加载中…</p></main>
<script type="module">
import { cardsToSnapshot, linearRef } from '/aoi/aoi-snapshot.js';
const out = document.getElementById('out');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let SNAP = null;
function banner(live, why) {
  const b = document.getElementById('banner');
  b.className = 'banner ' + (live ? 'live' : 'fixture');
  b.textContent = live ? '● AoI 实时快照（live）' : '⚠ 降级：fixture 回退（非 AoI 实时数据，全部节点均为未验证）— 原因：' + why;
}
function showEv(id) {
  const n = SNAP.nodes.find((x) => x.id === id); if (!n) return;
  document.querySelectorAll('.fn').forEach((d) => d.classList.toggle('sel', d.dataset.id === id));
  const ev = Array.isArray(n.evidence_refs) ? n.evidence_refs : [];
  const ok = n.state === 'verified' && ev.length > 0;
  const lr = n.linear_ref || linearRef(n.label);
  const inEdges = SNAP.edges.filter((e) => e.to_id === id);
  const p = document.getElementById('ev'); p.className = 'open';
  p.innerHTML = `<button id="evx">关闭</button><h3>${esc(n.label)}</h3>
   <p><span class="st ${ok ? 'verified' : 'unverified'}">${ok ? '✔ verified（有证据链）' : '✖ 未验证 — ' + (n.state === 'verified' ? '声称 verified 但无证据，已降级' : '无 AoI 证据链（state=' + esc(n.state) + '）')}</span></p>
   <p class="muted">id: ${esc(n.id)} · layer: ${esc(n.layer || '')} · wb: ${esc(n.wb_status ?? '')}</p>
   <p>Linear：${lr ? `<a href="${esc(lr.url)}" target="_blank" rel="noopener">${esc(lr.id)}</a>` : '<span class="muted">未关联</span>'}</p>
   <h4>证据链 (${ev.length})</h4>${ev.length ? '<ol>' + ev.map((r) => `<li><pre>${esc(typeof r === 'string' ? r : JSON.stringify(r, null, 1))}</pre></li>`).join('') + '</ol>' : '<p class="muted">无证据</p>'}
   <h4>上游边</h4>${inEdges.map((e) => `<div class="muted">${esc(e.from_id)} —${esc(e.relation)}→ · evidence_status=${esc(e.evidence_status)}</div>`).join('') || '<p class="muted">无</p>'}`;
  document.getElementById('evx').onclick = () => { p.className = ''; };
}
out.addEventListener('click', (e) => { const d = e.target.closest('.fn'); if (d) showEv(d.dataset.id); });
function render(snap, label) {
  SNAP = snap;
  document.getElementById('meta').textContent = `${label} · mode=${snap.mode} · ${snap.nodes.length} 节点 · ${snap.edges.length} 边 · verified 仅凭 AoI 证据`;
  const goals = snap.nodes.filter((n) => n.kind === 'goal');
  out.innerHTML = goals.map((g) => {
    const fns = snap.edges.filter((e) => e.from_id === g.id).map((e) => snap.nodes.find((n) => n.id === e.to_id)).filter(Boolean);
    return `<section class="goal"><h3>${esc(g.label)} <span class="muted">(${fns.length})</span></h3>` +
      fns.map((f) => `<div class="fn" data-id="${esc(f.id)}"><span>${esc(f.label)}</span><span class="st ${esc(f.state)}">${esc(f.state)} · ${esc(f.wb_status ?? '')}</span></div>`).join('') + '</section>';
  }).join('') + `<details><summary>CapabilitySnapshot JSON</summary><pre>${esc(JSON.stringify(snap, null, 1))}</pre></details>`;
}
let LIVE = null, STRUCT = null, TREE = null, WHY = '';
function renderTree(t) {
  const kids = new Map(); const ids = new Set(t.nodes.map((n) => n.id));
  for (const n of t.nodes) { const k = n.parent_id && ids.has(n.parent_id) ? n.parent_id : ''; if (!kids.has(k)) kids.set(k, []); kids.get(k).push(n); }
  const li = (n, d) => `<div class="fn" style="padding-left:${d * 18}px;cursor:default"><span>${d ? '└ ' : ''}${esc(n.title || n.id)} <span class="muted">${esc(n.kind || '')}</span></span><span class="st">${esc(n.status || 'idea')}</span></div>` + (d < 8 ? (kids.get(n.id) || []).map((c) => li(c, d + 1)).join('') : '');
  document.getElementById('meta').textContent = `结构 · work_nodes (${esc(t.source || '')}) · ${t.nodes.length} 节点`;
  out.innerHTML = '<section class="goal"><h3>工厂结构树 <a href="/graph" style="font-size:12px">Graph 视图 →</a></h3>' + (kids.get('') || []).map((n) => li(n, 0)).join('') + '</section>';
}
function show(t) {
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  if (t === 'live') {
    if (LIVE) { banner(true); render(LIVE.snapshot, 'AoI 实时 ' + (LIVE.endpoint || '')); if (!LIVE.snapshot.edges.length) out.insertAdjacentHTML('afterbegin', '<p class="muted">实时快照暂无能力/边数据（AoI staging 当前只有 ' + LIVE.snapshot.nodes.length + ' 个节点）。切到「结构」看工作台结构。</p>'); }
    else { banner(false, WHY); out.innerHTML = '<p class="muted">AoI 实时快照不可用：' + esc(WHY) + '</p>'; }
  } else {
    const b = document.getElementById('banner'); b.className = 'banner fixture'; b.textContent = '结构展示（未经 AoI 证据验证，全部为 unverified/potential）';
    if (STRUCT && STRUCT.nodes.length) render(STRUCT, '结构'); else if (TREE && TREE.nodes && TREE.nodes.length) renderTree(TREE); else out.innerHTML = '<p class="muted">暂无结构数据：工作台里还没有卡片。去 <a href="/workbench">工作台</a> 新建卡片，或看 <a href="/graph">Graph</a>。</p>';
  }
}
document.getElementById('tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(b.dataset.t); });
try {
  try { const l = await (await fetch('/aoi/api/snapshot', { credentials: 'same-origin' })).json(); if (l && l.source === 'aoi' && l.snapshot) LIVE = l; else WHY = (l && l.reason) || 'AoI 代理不可用'; } catch { WHY = 'AoI 代理不可用'; }
  try { const r = await fetch('/api/cards', { credentials: 'same-origin' }); if (r.ok) STRUCT = cardsToSnapshot((await r.json()).cards || []); } catch {}
  if (!STRUCT || !STRUCT.nodes.length) { try { TREE = await (await fetch('/graph/api/nodes')).json(); } catch {} }
  show(LIVE && LIVE.snapshot.edges.length ? 'live' : 'struct');
} catch (e) { out.innerHTML = '<p>加载失败：' + esc(e.message || e) + '</p>'; }
</script>
</body>
</html>
