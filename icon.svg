<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!--
    Flat geometric X for UI chrome and small sizes.
    The 3D crystal render turns to mush below ~64px, so the mark keeps the same
    silhouette (mitered bars crossing at 45°) but paints the facet lighting with
    two-stop gradients: a lit cyan edge and a dark navy body, exactly the light
    logic of the render.
  -->
  <defs>
    <linearGradient id="facetA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9BF0FF"/>
      <stop offset="0.35" stop-color="#3FC9E8"/>
      <stop offset="1" stop-color="#123C6B"/>
    </linearGradient>
    <linearGradient id="facetB" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#7FE8FF"/>
      <stop offset="0.4" stop-color="#2AA6CE"/>
      <stop offset="1" stop-color="#0E2A4F"/>
    </linearGradient>
  </defs>

  <!-- bar: bottom-left → top-right -->
  <g transform="rotate(45 32 32)">
    <rect x="25.5" y="5" width="13" height="54" rx="2.5" fill="url(#facetA)"/>
    <rect x="25.5" y="5" width="3" height="54" fill="#CFF7FF" opacity="0.55"/>
  </g>

  <!-- bar: top-left → bottom-right -->
  <g transform="rotate(-45 32 32)">
    <rect x="25.5" y="5" width="13" height="54" rx="2.5" fill="url(#facetB)"/>
    <rect x="35.5" y="5" width="3" height="54" fill="#BFF2FF" opacity="0.45"/>
  </g>
</svg>
