<!DOCTYPE html>
<html lang="zh-Hans" data-lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X-connect Factory OS</title>
  <meta name="description" content="空白画布上的工厂操作系统：助手带你一步步建起树、图与 AoI。">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Linear-like empty canvas home — keeps stage tokens where present */
    html, body.factory-blank {
      height: 100%;
      margin: 0;
      background: #0a0a0b;
      color: #e8e8ed;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Segoe UI", sans-serif;
    }
    body.factory-blank { min-height: 100vh; display: flex; flex-direction: column; }
    .fb-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 22px; border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .fb-brand { display: flex; gap: 10px; align-items: center; text-decoration: none; color: inherit; }
    .fb-brand img { width: 22px; height: 22px; }
    .fb-brand strong { font-weight: 600; letter-spacing: -0.02em; font-size: 14px; }
    .fb-brand span { color: #8a8f98; font-size: 12px; margin-left: 2px; }
    .fb-skip {
      appearance: none; background: transparent; border: 0; color: #8a8f98;
      font: 500 12px/1 inherit; cursor: pointer; padding: 6px 8px; border-radius: 6px;
    }
    .fb-skip:hover { color: #e8e8ed; background: rgba(255,255,255,.04); }
    #xc-canvas {
      flex: 1; display: grid; place-items: center; padding: 32px 20px 96px;
      position: relative;
    }
    #xc-canvas .fb-empty {
      text-align: center; color: #63666f; font-size: 13px; letter-spacing: 0.01em;
      max-width: 28ch; line-height: 1.5;
    }
    #xc-canvas .fb-layer {
      width: min(720px, 100%); display: none; flex-direction: column; gap: 18px;
      animation: fb-in .35s ease both;
    }
    #xc-canvas .fb-layer.on { display: flex; }
    @keyframes fb-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .fb-kicker { font-size: 11px; color: #8a8f98; letter-spacing: .06em; text-transform: uppercase; }
    .fb-title { margin: 0; font-size: clamp(1.6rem, 3.5vw, 2.15rem); font-weight: 600; letter-spacing: -0.04em; line-height: 1.15; max-width: 16ch; }
    .fb-lead { margin: 0; color: #9b9fa8; font-size: 15px; line-height: 1.55; max-width: 42ch; }
    .fb-cards { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
    .fb-card {
      display: grid; gap: 6px; padding: 14px; border-radius: 12px; text-decoration: none; color: inherit;
      border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.02);
      transition: border-color .15s, background .15s, transform .15s;
    }
    .fb-card:hover { border-color: rgba(94,106,210,.55); background: rgba(255,255,255,.04); transform: translateY(-1px); }
    .fb-card code { font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: #8a8f98; }
    .fb-card strong { font-size: 15px; letter-spacing: -0.02em; }
    .fb-card span { font-size: 12.5px; color: #8a8f98; line-height: 1.4; }
    .fb-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .fb-btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 8px;
      text-decoration: none; font-size: 13px; font-weight: 500; border: 1px solid rgba(255,255,255,.1);
      color: #e8e8ed; background: rgba(255,255,255,.03);
    }
    .fb-btn.primary { background: #5e6ad2; border-color: transparent; color: #fff; }
    .fb-btn.primary:hover { filter: brightness(1.06); }
    .fb-btn:hover { background: rgba(255,255,255,.06); }
    @media (max-width: 720px) { .fb-cards { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="factory-blank">
  <header class="fb-top">
    <a class="fb-brand" href="/" aria-label="X-connect Factory OS">
      <img src="icon.svg" alt="" width="22" height="22">
      <strong>X-connect</strong>
      <span>Factory OS</span>
    </a>
    <button type="button" class="fb-skip" id="fbSkip" hidden>跳过引导，显示全部</button>
  </header>

  <main id="xc-canvas" aria-live="polite">
    <p class="fb-empty" id="fbEmpty">画布是空的。右下角助手会带你一步步搭起来。</p>

    <section class="fb-layer" id="fbIntro" hidden>
      <div class="fb-kicker">Factory OS</div>
      <h1 class="fb-title">把想法放进一棵树，做到有据可查。</h1>
      <p class="fb-lead">工厂操作系统：树管推进，图看关系，AoI 核对证据。我们先把骨架搭上。</p>
    </section>

    <section class="fb-layer" id="fbModules" hidden>
      <div class="fb-cards" role="navigation" aria-label="Factory modules">
        <a class="fb-card" href="/tree"><code>/tree</code><strong>树</strong><span>建节点、推进 idea → verified</span></a>
        <a class="fb-card" href="/graph"><code>/graph</code><strong>图</strong><span>同一数据，一键 Tree | Graph</span></a>
        <a class="fb-card" href="/aoi"><code>/aoi</code><strong>AoI</strong><span>看板与 verified 证据位</span></a>
      </div>
    </section>

    <section class="fb-layer" id="fbNext" hidden>
      <div class="fb-actions">
        <a class="fb-btn primary" href="/workbench">打开工作台</a>
        <a class="fb-btn" href="/portal">委托样品（完整门面）</a>
        <a class="fb-btn" href="/tree">先建第一个节点</a>
      </div>
    </section>
  </main>
  <script src="factory-home.js" defer></script>
</body>
</html>
