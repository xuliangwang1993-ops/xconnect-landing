<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X-connect · Projects</title>
  <meta name="description" content="Factory OS — projects and issues, Linear-style.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0a0a0b; --panel: #101012; --line: rgba(255,255,255,.08);
      --text: #ececef; --mute: #8a8f98; --accent: #5e6ad2; --ok: #3dd68c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
      font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif; }
    a { color: inherit; text-decoration: none; }
    header.app {
      display: flex; align-items: center; gap: 14px; padding: 12px 18px;
      border-bottom: 1px solid var(--line); position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(10px); z-index: 5;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: -.02em; }
    .brand img.brand-logo { height: 32px; width: auto; display: block; }
    .brand span { color: var(--mute); font-weight: 500; font-size: 12px; }
    nav.tabs { display: flex; gap: 4px; margin-left: 8px; }
    nav.tabs a { padding: 6px 10px; border-radius: 6px; color: var(--mute); font-size: 13px; }
    nav.tabs a.on, nav.tabs a:hover { background: rgba(255,255,255,.05); color: var(--text); }
    .spacer { flex: 1; }
    .mode { font-size: 11px; color: var(--mute); }
    button, .btn {
      appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,.03);
      color: var(--text); border-radius: 7px; padding: 7px 11px; font: inherit; cursor: pointer;
    }
    button.primary, .btn.primary { background: var(--accent); border-color: transparent; color: #fff; font-weight: 560; }
    button.primary:hover, .btn.primary:hover { filter: brightness(1.06); }
    button.ghost { background: transparent; }
    main { max-width: 920px; margin: 0 auto; padding: 28px 18px 80px; }
    .crumb { display: flex; gap: 8px; align-items: center; color: var(--mute); font-size: 13px; margin-bottom: 18px; }
    .crumb strong { color: var(--text); font-weight: 560; }
    h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.03em; font-weight: 600; }
    .sub { margin: 0 0 22px; color: var(--mute); font-size: 13px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
    .toolbar input {
      flex: 1; min-width: 180px; background: var(--panel); border: 1px solid var(--line);
      color: var(--text); border-radius: 7px; padding: 8px 10px; font: inherit;
    }
    .list { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
    .row {
      display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center;
      padding: 12px 14px; border-top: 1px solid var(--line); cursor: pointer;
    }
    .row:first-child { border-top: 0; }
    .row:hover { background: rgba(255,255,255,.03); }
    .row .title { font-weight: 550; letter-spacing: -.01em; }
    .row .meta { color: var(--mute); font-size: 12px; margin-top: 2px; }
    .pill {
      font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line);
      color: var(--mute); white-space: nowrap;
    }
    .pill.idea { color: #9aa0a6; }
    .pill.in_progress { color: #5e6ad2; border-color: rgba(94,106,210,.35); }
    .pill.evidence { color: #f2c94c; border-color: rgba(242,201,76,.35); }
    .pill.verified { color: var(--ok); border-color: rgba(61,214,140,.35); }
    .empty {
      border: 1px dashed var(--line); border-radius: 12px; padding: 48px 24px; text-align: center;
      color: var(--mute);
    }
    .empty h2 { margin: 0 0 8px; color: var(--text); font-size: 16px; font-weight: 600; letter-spacing: -.02em; }
    .empty p { margin: 0 auto 18px; max-width: 36ch; font-size: 13px; line-height: 1.5; }
    .empty .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    dialog {
      border: 1px solid var(--line); border-radius: 12px; padding: 0; background: #121214; color: var(--text);
      width: min(420px, calc(100vw - 24px));
    }
    dialog::backdrop { background: rgba(0,0,0,.55); }
    dialog form { display: grid; gap: 10px; padding: 16px; }
    dialog h3 { margin: 0; font-size: 15px; }
    dialog input, dialog select {
      width: 100%; background: #0c0c0e; border: 1px solid var(--line); color: var(--text);
      border-radius: 7px; padding: 8px 10px; font: inherit;
    }
    dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    .err { color: #ff7b72; font-size: 12px; min-height: 1em; }
  </style>
</head>
<body>
  <header class="app">
    <a class="brand" href="/" aria-label="X-connect 首页"><img class="brand-logo" src="brand-logo.png" alt="X-connect"></a>
    <nav class="tabs" aria-label="Views">
      <a href="/" class="on" id="tabProjects" data-i18n="nav.projects">Projects</a>
      <a href="/graph" data-i18n="nav.graph">Graph</a>
      <a href="/aoi" data-i18n="nav.aoi">AoI</a>
      <a href="/workbench" data-i18n="nav.workbench">Workbench</a>
      <a href="/settings" data-i18n="nav.setting">Setting</a>
    </nav>
    <div class="spacer"></div>
    <span class="mode" id="mode"></span>
  </header>

  <main id="app"></main>

  <dialog id="dlg">
    <form method="dialog" id="dlgForm">
      <h3 id="dlgTitle">New project</h3>
      <input name="title" id="dlgInput" placeholder="Name" required maxlength="120" autocomplete="off">
      <div class="err" id="dlgErr"></div>
      <div class="foot">
        <button value="cancel" class="ghost" type="submit">Cancel</button>
        <button value="ok" class="primary" id="dlgOk" type="submit">Create</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="factory-home.js"></script>
</body>
</html>
