<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-Connect · 选角</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d0d12; color:#e8e8ec; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  .logo { font-size:13px; letter-spacing:3px; color:#555; margin-bottom:48px; }
  .logo span { color:#ff8c42; }
  h1 { font-size:22px; font-weight:500; margin-bottom:8px; }
  .sub { font-size:13px; color:#777; margin-bottom:48px; }
  .grid { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; margin-bottom:48px; }
  .slot { width:120px; text-align:center; cursor:pointer; padding:16px 8px; border-radius:14px; border:1.5px solid transparent; transition:all .25s; }
  .slot:hover { border-color:#333; background:#16161c; }
  .slot.selected { border-color:#ff8c42; background:#1a140e; }
  .avatar { width:72px; height:72px; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:30px; background:#1c1c24; }
  .slot.selected .avatar { box-shadow:0 0 0 3px #ff8c42; }
  .name { font-size:14px; font-weight:600; }
  .name-en { font-size:11px; color:#888; margin-top:2px; font-weight:400; }
  .slot.selected .name-en { color:#ff8c42; }
  .btn { background:#ff8c42; color:#0d0d12; border:none; padding:12px 40px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; opacity:.35; pointer-events:none; transition:opacity .25s; }
  .btn.on { opacity:1; pointer-events:auto; }
  .btn.on:hover { background:#ff9f5c; }
  .hint { font-size:11px; color:#444; margin-top:16px; }

  /* 多语种切换（和主页拉齐） */
  .lang-toggle { position:fixed; top:20px; right:20px; background:none; border:1px solid #333; color:#888; padding:6px 14px; border-radius:6px; font-size:12px; cursor:pointer; transition:all .2s; }
  .lang-toggle:hover { border-color:#ff8c42; color:#ff8c42; }
  .lang-toggle .lang-zh { display:none; }
  .lang-toggle .lang-en { display:inline; }
  body[data-lang="en"] .lang-toggle .lang-zh { display:inline; }
  body[data-lang="en"] .lang-toggle .lang-en { display:none; }

  /* 中文内容 */
  .lang-zh { display:inline; }
  .lang-en { display:none; }
  body[data-lang="en"] .lang-zh { display:none; }
  body[data-lang="en"] .lang-en { display:inline; }
</style>
</head>
<body data-lang="zh">
  <button class="lang-toggle" id="langToggle" aria-label="Switch language">
    <span class="lang-zh">EN</span>
    <span class="lang-en">中文</span>
  </button>

  <div class="logo">X<span>−</span>CONNECT</div>
  <h1>
    <span class="lang-zh">选一个助手</span>
    <span class="lang-en">Pick your assistant</span>
  </h1>
  <div class="sub">
    <span class="lang-zh">五个通用助手，性格不同，能力一样。选错的代价只是一句话，随时能换。</span>
    <span class="lang-en">Five general assistants, same skills, different vibes. Pick wrong? Just say the word and switch.</span>
  </div>
  <div class="grid" id="grid"></div>
  <button class="btn" id="btn" onclick="go()">
    <span class="lang-zh">确认选择</span>
    <span class="lang-en">Confirm</span>
  </button>
  <div class="hint">
    <span class="lang-zh">选完自动跳转到 app.x-connect.ai</span>
    <span class="lang-en">Redirects to app.x-connect.ai after selection</span>
  </div>

<script>
// 多语种管理（和主页拉齐）
class LanguageManager {
  constructor() {
    this.currentLang = localStorage.getItem('xconnect-lang') || 'zh';
    this.init();
  }
  init() {
    document.body.setAttribute('data-lang', this.currentLang);
    const toggle = document.getElementById('langToggle');
    if (toggle) toggle.addEventListener('click', () => this.toggle());
  }
  toggle() {
    this.currentLang = this.currentLang === 'zh' ? 'en' : 'zh';
    document.body.setAttribute('data-lang', this.currentLang);
    localStorage.setItem('xconnect-lang', this.currentLang);
  }
}
new LanguageManager();

// 五个通用助手（本命）
const chars = [
  { id:'voice',  name:'李黑鸭', nameEn:'Duck Lee',    emoji:'🦆' },
  { id:'scribe', name:'斯巴达', nameEn:'Sparky',      emoji:'⚡' },
  { id:'brain',  name:'四毛',   nameEn:'Forty Cents', emoji:'🎤' },
  { id:'deep',   name:'武天',   nameEn:'WuTian',      emoji:'🥋' },
  { id:'admin',  name:'狒狒',   nameEn:'Feifei',      emoji:'🐒' }
];

let sel = null;
const grid = document.getElementById('grid');
const btn = document.getElementById('btn');

chars.forEach(c => {
  const d = document.createElement('div');
  d.className = 'slot';
  d.innerHTML = `
    <div class="avatar">${c.emoji}</div>
    <div class="name">
      <span class="lang-zh">${c.name}</span>
      <span class="lang-en">${c.nameEn}</span>
    </div>
    <div class="name-en">
      <span class="lang-zh">${c.nameEn}</span>
      <span class="lang-en">${c.name}</span>
    </div>
  `;
  d.onclick = () => {
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
    d.classList.add('selected');
    sel = c.id;
    btn.classList.add('on');
  };
  grid.appendChild(d);
});

function go(){
  if(!sel) return;
  // 写域 cookie，让 app.x-connect.ai 立刻读到
  document.cookie = 'xc_assistant=' + encodeURIComponent(sel) + '; Domain=.x-connect.ai; Path=/; Max-Age=' + (60*60*24*365) + '; SameSite=Lax; Secure';
  location.href = 'https://app.x-connect.ai/?onboard=1';
}
</script>
</body>
</html>
